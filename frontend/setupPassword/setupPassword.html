<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/recettes.css" />
    <title>Setup Password</title>
</head>
<body class = "bg-light">
<section class = "login">
    <div class = "boxForm shadow">
        <form id="formLogin" class="formLogin">
            <h2 class = "text-center mb-4">Créer votre mot de passe</h2>
            <br />

            <div class = "input-group-container">
                <input
                        type="password"
                        id="newPassword"
                        placeholder="Nouveau mot de passe au moins 8 caractères" required>
                <br />
                <br/>
                <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Confirmation le mot de passe" required>
                <br />
                <br/>
                <button type="submit" class = "container-fluid btn btn-primary">
                    Valider
                </button>
            </div>
        </form>
    </div>
</section>
<script src="setupPassword.js"></script>
</body>
</html>
