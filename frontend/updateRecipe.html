<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/recettes.css" />
    <link rel="stylesheet" href="assets/recipeDetail.css" />
    <title>Update recipe</title>
</head>
<body>

<div class="container-detail">

    <a href="adminRecipes.html" class="back-link">← Retour</a>

    <h1>Modifier la recette</h1>

    <form id="addRecipeForm" class="recipe-form">

        <div class="form-card">
            <div class="form-grid">

                <div>
                    <label>Titre</label>
                    <input type="text" id="title" required>

                    <label>Catégorie</label>
                    <select id="category" required></select>

                    <label>Préparation</label>
                    <input type="number" id="prepareTime" min="1" required>

                    <label>Cuisson</label>
                    <input type="number" id="cookTime" min="1"required>

                    <label>Portion</label>
                    <input type="number" id="portion" min="1"required>
                </div>

                <div>
                    <label>Photo</label>
                    <input type="file" id="photo" accept= ".jpg,.jpeg,.png" placeholder="ex: curry.jpg">

                    <label>Description</label>
                    <textarea id="description" required></textarea>
                </div>
            </div>
            <div>
                <h3>Ingrédients</h3>
                <div id="ingredientsContainer"></div>

                <button type="button" id="addIngredientBtn" class="secondary-btn">
                    + Ajouter
                </button>
            </div>
        </div>

        <div class="footer-section">
            <p></p>
            <button type="submit" class="button-save">
                Enregistrer
            </button>
            <button type="button" class="button-cancel" id="cancelBtn">
                Annuler
            </button>
        </div>
    </form>

</div>
<script src="js/config.js"></script>
<script src="js/updateRecipe.js"></script>

</body>
</html>
