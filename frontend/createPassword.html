<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/recettes.css" />
    <title>Create Password</title>
</head>
<body>
<section class="login">
    <div class = "boxForm shadow">

        <div class="mb-3">
            <a href="login.html" >
                <i class="bi bi-arrow-left"></i> ← Retour à l'accueil
            </a>
        </div>

        <form class = "formLogin" id="formLogin">
            <h1 class = "text-center mb-4 fw-bold">Créer votre mot de passe</h1>
            <br />
                <div class = "input-group-container">


<!--                    <label for="inputMail" class="form-label">Email</label>-->
<!--                    <input-->
<!--                            type="email"-->
<!--                            class="form-control"-->
<!--                            id="inputMail"-->
<!--                            required />-->

                    <label class="form-label">Nouveau mot de passe</label>
                    <input
                            type="password"
                            id="newPassword"
                            placeholder="Nouveau mot de passe au moins 8 caractères" required>
                    <br />
                    <br/>
                    <label class="form-label">Confirmation mot de passe</label>
                    <input
                            type="password"
                            id="confirmNewPassword"
                            placeholder="Confirmation du mot de passe identique" required>
                    <br />
                    <br/>


            <br />
            <button type="submit" class="btn btn-primary">Valider</button>
                </div>
        </form>
    </div>
</section>
<script src = "js/config.js"></script>
<script src = "js/createPassword.js"></script>

</body>
</html>
