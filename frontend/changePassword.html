<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/recettes.css">
    <title>Change Password</title>
</head>
<body>
<section class="login">
    <div class="boxForm shadow">

        <div class="mb-3">
            <a href="login.html">← Retour au login</a>
        </div>

        <form class="formLogin" id="changePasswordForm">
            <h1 class="text-center mb-4 fw-bold">
                Modifier le mot de passe
            </h1>

            <label for="mail" class="form-label">Email</label>
            <input
                    type="email"
                    id="mail"
                    placeholder="Votre email"
                    required
            >

            <label for="oldPassword" class="form-label">Mot de passe actuel</label>
            <input
                    type="password"
                    id="oldPassword"
                    placeholder="Mot de passe actuel"
                    required
            >

            <label for="newPassword" class="form-label">Nouveau mot de passe</label>
            <input
                    type="password"
                    id="newPassword"
                    placeholder="Minimum 8 caractères"
                    required
            >

            <label for="confirmNewPassword" class="form-label">Confirmer le mot de passe</label>
            <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirmer le nouveau mot de passe"
                    required
            >

            <button type="submit" class="btn btn-primary">
                Valider
            </button>
        </form>

    </div>
</section>

<script src="js/config.js"></script>
<script src="js/changePassword.js"></script>

</body>
</html>
